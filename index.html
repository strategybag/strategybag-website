<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STRATEGY BAG | Header Preview</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-shell">
      <a href="#" class="brand">
        <img src="strategy-bag-logo.jpg" alt="STRATEGY BAG">
      </a>

      <nav class="main-nav" aria-label="Primary navigation">
        <a class="active" href="#">Home</a>
        <a href="#capabilities">Capabilities</a>
        <a href="#experience">Experience</a>
        <a href="#insights">Insights</a>
        <a href="#about">About</a>
      </nav>

      <a class="talk-button" href="#">Let's Talk <span>→</span></a>
    </div>
  </header>

  <section class="hero">
    <div class="hero-shell">
      <div class="hero-copy">
        <p class="eyebrow">STRATEGY · INNOVATION · GROWTH</p>
        <h1>UNLEASH<br><span>BRAND POWER</span></h1>
        <p class="deck">
          STRATEGY BAG helps organizations unlock growth through brand strategy,
          commercialization, innovation and AI-enabled execution.
        </p>
        <div class="hero-actions">
          <a class="primary-button" href="#">Start a Conversation <span>→</span></a>
          <a class="secondary-button" href="#experience">View Experience <span>→</span></a>
        </div>
      </div>

      <div class="hero-image-wrap">
        <img src="rocket-hero-right.png" alt="Rocket launching with the message Better Brands. Faster Growth. Bigger Impact.">
      </div>
    </div>
  </section>
</body>
</html>
