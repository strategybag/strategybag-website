name: Refresh STRATEGY BAG Insights

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update_insights.py
      - run: |
          git config user.name "STRATEGY BAG Insights Bot"
          git config user.email "actions@users.noreply.github.com"
          git add insights.json
          git diff --cached --quiet || git commit -m "Refresh homepage insights"
          git push
